{% extends 'admin/base.html' %}
{% load static %}

{% block extrajs %}
    {{ block.super }}
    {% if request.user.is_authenticated and request.user.is_staff %}
        <style>
            /* Estilo para que la campana quede bien alineada con el badge */
            .navbar-badge {
                font-size: .6rem;
                font-weight: 300;
                padding: 2px 4px;
                position: absolute;
                right: 5px;
                top: 9px;
            }
            .notification-item {
                white-space: normal;
                word-wrap: break-word;
            }
            .notification-dropdown {
                width: 300px;
                max-height: 400px;
                overflow-y: auto;
            }

            /* --- CORRECCIÓN DE VISIBILIDAD SELECT2 (ACCIONES) --- */
            .select2-container--default .select2-selection--single,
            .select2-container--default .select2-selection--multiple {
                background-color: #2a2a2a !important;
                border: 1px solid #d4af37 !important;
                color: white !important;
                height: 38px !important;
                display: flex !important;
                align-items: center !important;
            }
            .select2-container--default .select2-selection--single .select2-selection__rendered {
                color: white !important;
                padding-left: 10px !important;
            }
            .select2-container--default .select2-selection--single .select2-selection__arrow b {
                border-color: #d4af37 transparent transparent transparent !important;
            }
            .select2-dropdown {
                background-color: #2a2a2a !important;
                color: white !important;
                border: 1px solid #d4af37 !important;
                z-index: 9999 !important;
            }
            .select2-results__option {
                color: white !important;
                padding: 8px 12px !important;
            }
            .select2-results__option--highlighted[aria-selected],
            .select2-results__option[aria-selected="true"] {
                background-color: #d4af37 !important;
                color: black !important;
            }
            .select2-search__field {
                background-color: #1a1a1a !important;
                color: white !important;
                border: 1px solid #d4af37 !important;
            }
            /* Botón de acción alineación */
            button[name="index"][value="0"] {
                height: 38px !important;
                margin-left: 5px !important;
                vertical-align: top !important;
            }

            /* --- CORRECCIÓN SELECTOR DE PERMISOS (FILTER HORIZONTAL) --- */
            .selector .selector-available h2, 
            .selector .selector-chosen h2 {
                background: #1a1a1a !important;
                color: #d4af37 !important;
                border: 1px solid #444 !important;
                font-weight: bold !important;
                text-transform: uppercase !important;
                font-size: 0.75rem !important;
            }

            .selector select {
                background-color: #2a2a2a !important;
                color: #ffffff !important;
                border: 1px solid #444 !important;
                border-radius: 0 0 4px 4px !important;
            }

            .selector .selector-filter {
                background: #2a2a2a !important;
                border: 1px solid #444 !important;
                border-bottom: none !important;
                color: white !important;
            }

            .selector .selector-filter input {
                background-color: #1a1a1a !important;
                color: white !important;
                border: 1px solid #d4af37 !important;
                padding: 4px 8px !important;
            }

            .selector-chosen select {
                border-top: none !important;
            }

            .selector-available select {
                border-top: none !important;
            }

            .selector .selector-filter label {
                color: #d4af37 !important;
            }

            .selector-available input::placeholder {
                color: rgba(255,255,255,0.4) !important;
            }
        </style>

        <template id="admin-notifications-template">
            <li class="nav-item dropdown">
                <a class="nav-link" data-bs-toggle="dropdown" href="#" title="Notificaciones" aria-expanded="false">
                    <i class="far fa-bell" style="font-size: 1.2em;"></i>
                    {% if admin_notifications_count > 0 %}
                        <span class="badge bg-danger navbar-badge">{{ admin_notifications_count }}</span>
                    {% endif %}
                </a>
                <div class="dropdown-menu dropdown-menu-lg dropdown-menu-right notification-dropdown">
                    <span class="dropdown-item dropdown-header">{{ admin_notifications_count|default:0 }} Notificaciones Nuevas</span>
                    
                    {% if admin_mensajes_contacto %}
                        <div class="dropdown-divider"></div>
                        <span class="dropdown-item dropdown-header bg-light"><strong>Mensajes de Contacto</strong></span>
                        {% for msg in admin_mensajes_contacto %}
                            <div class="dropdown-divider"></div>
                            <a href="/admin/users/mensajecontacto/{{ msg.id }}/change/" class="dropdown-item notification-item">
                                <i class="fas fa-envelope mr-2 text-info"></i> {{ msg.asunto|truncatechars:30 }}
                                <br><small class="text-muted"><i class="far fa-clock mr-1"></i>{{ msg.fecha_envio|timesince }}</small>
                            </a>
                        {% endfor %}
                    {% endif %}

                    {% if admin_solicitudes %}
                        <div class="dropdown-divider"></div>
                        <span class="dropdown-item dropdown-header bg-light"><strong>Servicios (Eventos/Transporte)</strong></span>
                        {% for sol in admin_solicitudes %}
                            <div class="dropdown-divider"></div>
                            <a href="/admin/orders/solicitudservicio/{{ sol.id }}/change/" class="dropdown-item notification-item">
                                <i class="fas fa-concierge-bell mr-2 text-warning"></i> {{ sol.nombre_entidad|truncatechars:30 }}
                                <br><small class="text-muted">Estado: {{ sol.get_estado_display }}</small>
                            </a>
                        {% endfor %}
                    {% endif %}

                    {% if admin_pedidos %}
                        <div class="dropdown-divider"></div>
                        <span class="dropdown-item dropdown-header bg-light"><strong>Pedidos de Mercado</strong></span>
                        {% for ped in admin_pedidos %}
                            <div class="dropdown-divider"></div>
                            <a href="/admin/orders/pedidomercado/{{ ped.id }}/change/" class="dropdown-item notification-item">
                                <i class="fas fa-shopping-cart mr-2 text-success"></i> Pedido #{{ ped.id }} ({{ ped.organizacion.nombre }})
                                <br><small class="text-muted"><i class="far fa-clock mr-1"></i>{{ ped.fecha_pedido|timesince }}</small>
                            </a>
                        {% endfor %}
                    {% endif %}

                    {% if num_chats_admin > 0 %}
                        <div class="dropdown-divider"></div>
                        <a href="{% url 'admin_chat_dashboard' %}" class="dropdown-item dropdown-header bg-warning text-dark">
                            <i class="fas fa-comments me-2"></i> <strong>{{ num_chats_admin }} Chats con mensajes nuevos</strong>
                        </a>
                    {% endif %}

                    {% if admin_notifications_count == 0 %}
                        <div class="dropdown-divider"></div>
                        <a href="#" class="dropdown-item text-center text-muted"><small>No hay notificaciones nuevas</small></a>
                    {% endif %}
                    
                    <div class="dropdown-divider"></div>
                    <a href="#" class="dropdown-item dropdown-footer text-center" onclick="document.querySelectorAll('.dropdown-menu').forEach(el => el.classList.remove('show'))">Cerrar</a>
                </div>
            </li>
        </template>

        <script>
            $(document).ready(function() {
                // Notificaciones
                var notificationsHtml = $('#admin-notifications-template').html();
                var userMenuLi = $('#jazzy-usermenu').parent();
                if(userMenuLi.length) {
                    userMenuLi.before(notificationsHtml);
                } else {
                    $('.navbar-nav.ms-auto').prepend(notificationsHtml);
                }

                // Lógica del Botón Dinámico de Acciones
                function updateActionButton() {
                    var actionSelect = $('select[name="action"]');
                    var submitBtn = $('button[name="index"][value="0"]');
                    
                    if (actionSelect.length && submitBtn.length) {
                        var selectedOption = actionSelect.find('option:selected');
                        var selectedValue = actionSelect.val();
                        var selectedText = selectedOption.text();

                        if (selectedValue === 'delete_selected') {
                            submitBtn.text("Eliminar Seleccionados").removeClass('btn-primary btn-secondary').addClass('btn-danger shadow-sm');
                        } else if (selectedValue) {
                            var cleanText = selectedText.split('...')[0].trim();
                            if (cleanText.length > 20) cleanText = "Ejecutar";
                            submitBtn.text(cleanText).removeClass('btn-danger btn-secondary').addClass('btn-primary shadow-sm');
                        } else {
                            submitBtn.text("Ir").removeClass('btn-danger btn-primary').addClass('btn-secondary');
                        }
                    }
                }

                // Inyectar badge en el sidebar para Chat en Vivo
                function updateSidebarChatBadge() {
                    var numChats = "{{ num_chats_admin|default:0 }}";
                    if (parseInt(numChats) > 0) {
                        // Buscamos el link que contiene "Chat en Vivo"
                        var chatLink = $('nav.mt-2 a:contains("Chat en Vivo")');
                        if (chatLink.length) {
                            // Si el badge ya existe, lo actualizamos; si no, lo creamos
                            var existingBadge = chatLink.find('.badge-chat-notify');
                            if (existingBadge.length) {
                                existingBadge.text(numChats);
                            } else {
                                // Buscamos el <p> dentro del <a> para añadirlo al lado del texto
                                var pTag = chatLink.find('p');
                                if (pTag.length) {
                                    pTag.append('<span class="badge bg-danger badge-chat-notify ms-2" style="font-size: 0.7rem; padding: 2px 5px; vertical-align: middle; margin-left: 10px; color: white !important; line-height: 1;">' + numChats + '</span>');
                                } else {
                                    chatLink.append('<span class="badge bg-danger badge-chat-notify ms-auto" style="font-size: 0.7rem; padding: 2px 5px; margin-left: 10px; color: white !important; line-height: 1;">' + numChats + '</span>');
                                }
                                chatLink.addClass('d-flex align-items-center');
                            }
                        }
                    }
                }

                // Escuchar cambios (compatible con Select2 si Jazzmin lo usa)
                $(document).on('change', 'select[name="action"]', updateActionButton);
                
                // Ejecutar al inicio y periódicamente por si se carga vía Ajax
                updateActionButton();
                updateSidebarChatBadge();
                setTimeout(function() {
                    updateActionButton();
                    updateSidebarChatBadge();
                }, 1000);
            });
        </script>
    {% endif %}
{% endblock %}
