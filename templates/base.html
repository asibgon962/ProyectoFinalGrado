<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TFG - Koi Enterprise Luxury Gestión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        /* Definición de la Paleta de Lujo */
        :root {
            --lux-black: #080808;      /* Negro Profundo del fondo del logo */
            --lux-gold: #D4AF37;       /* Oro Rico del emblema */
            --lux-gold-light: #F1E2A3; /* Oro Claro para texto */
            --lux-red: #B81D24;        /* Rojo Koi para acentos */
            --lux-white: #FFFFFF;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--lux-black);
            color: var(--lux-gold-light);
            margin: 0;
        }

        h1, h2, h3, .navbar-brand {
            font-family: 'Playfair Display', serif; /* Fuente con serifa para títulos premium */
            color: var(--lux-gold);
        }

        /* Barra de navegación de lujo */
        .navbar-lux {
            background-color: rgba(10, 10, 10, 0.95);
            border-bottom: 2px solid var(--lux-gold); /* Línea dorada divisoria */
        }

        .nav-link-lux {
            color: var(--lux-gold-light) !important;
            font-weight: 500;
        }

        .nav-link-lux:hover {
            color: var(--lux-red) !important; /* Acento rojo Koi al pasar el ratón */
        }

        /* Botón de Logout estilizado */
        .btn-logout-lux {
            background: none;
            border: 1px solid var(--lux-red);
            color: var(--lux-red);
            font-size: 0.85rem;
            padding: 5px 10px;
            border-radius: 4px;
        }
        .btn-logout-lux:hover {
            background-color: var(--lux-red);
            color: white;
        }
        
        /* Contenedor principal de contenido */
        .main-container-lux {
            background-color: #111; /* Ligeramente más claro que el fondo total */
            border: 1px solid #222;
            border-radius: 8px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.05); /* Sombra dorada muy sutil */
        
        }

        /* Botón Rojo Koi con borde Dorado */
        .btn-koi-red {
            background-color: #B81D24;
            color: white;
            border: 1px solid #D4AF37;
            transition: all 0.3s ease;
        }
        .btn-koi-red:hover {
            background-color: #8e161c;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(184, 29, 36, 0.4);
            color: white;
        }

        /* Bordes y acentos Dorados */
        .border-gold {
            border-color: #D4AF37 !important;
        }
        .text-gold {
            color: #D4AF37 !important;
        }
        .btn-outline-gold {
            border: 1px solid #D4AF37;
            color: #D4AF37;
        }
        .btn-outline-gold:hover {
            background-color: #D4AF37;
            color: black;
        }

        /* Animación sutil para el logo */
        .hero-logo {
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.2));
            transition: transform 0.5s ease;
        }
        .hero-logo:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-lux">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand d-flex align-items-center mx-auto" href="/">
                <img src="/static/images/logo.png" alt="Koi Enterprise Logo" height="60" class="me-3">
                <span class="fs-3 fw-bold">Koi Enterprise</span>
            </a>
            
            <div class="d-flex align-items-center">
                <a class="nav-link nav-link-lux me-3" href="/">Inicio</a>
                {% if user.is_authenticated %}
                    <span class="navbar-text me-3 text-light">Hola, <strong>{{ user.username }}</strong></span>
                    <form action="{% url 'logout' %}" method="post" style="display:inline;">
                        {% csrf_token %}
                        <button type="submit" class="btn-logout-lux">Cerrar sesión</button>
                    </form>
                {% else %}
                    <a class="nav-link nav-link-lux" href="{% url 'login' %}">Iniciar sesión</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="main-container-lux">
            {% block content %}
            {% endblock %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
