<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estado Actualizado · Koi Enterprise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0d0f13;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 3rem 2.5rem;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 40px rgba(0,0,0,.5);
            animation: fadeUp .45s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .icon {
            font-size: 3.5rem;
            line-height: 1;
            margin-bottom: 1.25rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #f0f6fc;
            margin-bottom: .5rem;
        }

        .badge-row {
            display: flex;
            gap: 1rem;
            justify-content: center;
            align-items: center;
            margin: 1.5rem 0;
            flex-wrap: wrap;
        }

        .badge {
            padding: .35rem .85rem;
            border-radius: 999px;
            font-size: .85rem;
            font-weight: 600;
            letter-spacing: .02em;
        }

        .badge-old  { background: #21262d; color: #8b949e; }
        .badge-new  { background: #1f4a30; color: #3fb950; }

        .arrow { color: #484f58; font-size: 1.2rem; }

        .meta {
            font-size: .85rem;
            color: #6e7681;
            margin-bottom: 2rem;
        }

        .meta strong { color: #8b949e; }

        .btn {
            display: inline-block;
            padding: .7rem 1.6rem;
            border-radius: 8px;
            font-size: .9rem;
            font-weight: 600;
            text-decoration: none;
            background: linear-gradient(135deg, #d4af37, #b8860b);
            color: #0d0f13;
            transition: opacity .2s, transform .15s;
        }

        .btn:hover { opacity: .88; transform: translateY(-1px); }

        .logo {
            font-size: .75rem;
            color: #484f58;
            margin-top: 2rem;
            letter-spacing: .05em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">⚡</div>
        <h1>Estado Actualizado</h1>

        <div class="badge-row">
            <span class="badge badge-old">{{ estado_anterior }}</span>
            <span class="arrow">→</span>
            <span class="badge badge-new">{{ nuevo_estado }}</span>
        </div>

        <p class="meta">
            <strong>{{ tipo_label }}</strong> #{{ objeto_id }}
        </p>

        <a href="https://koienterprise.onrender.com/admin/" class="btn">
            Ir al Panel de Control
        </a>

        <p class="logo">Koi Enterprise · Centro de Control</p>
    </div>
</body>
</html>
